<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#182443;background:#f4f6fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(130deg,#14295c,#3754a3);color:#fff;text-align:center;padding:34px 16px 30px}header .brand{font-weight:900;font-size:18px}header h1{font-size:clamp(24px,5vw,35px);margin:14px 0 8px}header p{margin:0;color:#dce5ff}.wrap{max-width:850px;margin:24px auto;padding:0 15px 70px}.panel{background:#fff;border-radius:18px;padding:22px;box-shadow:0 6px 22px #172c6412;margin-bottom:18px}.bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.tag{display:inline-block;background:#e8eeff;color:#2949a0;padding:6px 11px;border-radius:50px;font-size:13px;font-weight:800}.muted{color:#69758b;font-size:14px}.progress{height:9px;border-radius:20px;background:#e9edf7;overflow:hidden;margin-top:14px}.progress>div{height:100%;background:#4167d9;transition:width .2s}.question{border:1px solid #e5e9f4;border-radius:15px;padding:19px;margin:15px 0}.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.han{border:0;background:transparent;font-size:34px;font-weight:850;color:#142d73;cursor:pointer;padding:6px 0}.han:hover{text-decoration:underline}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.opt{border:1px solid #dce2ef;background:#fff;border-radius:10px;text-align:left;padding:13px 12px;min-height:53px;cursor:pointer;font-size:15px;color:#26334c;line-height:1.5}.opt.selected{background:#e7eeff;border-color:#4167d9;font-weight:700}.opt:disabled{cursor:default}.opt.correct{background:#e7f7ec;border-color:#43a565}.opt.wrong{background:#fff0ee;border-color:#e3685a}.feedback{margin-top:13px;background:#fff4e8;border-left:4px solid #e6a246;padding:12px;border-radius:6px;line-height:1.7}.btns{display:flex;flex-wrap:wrap;gap:9px}.btn{border:0;border-radius:11px;padding:13px 17px;background:#2949a0;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.btn.secondary{background:#e8edfa;color:#213d84}.btn:disabled{opacity:.45;cursor:not-allowed}.score{font-size:30px;font-weight:900;color:#233f91;margin:10px 0}.hidden{display:none!important}footer{text-align:center;color:#8791a6;font-size:13px;padding-top:20px}@media(max-width:550px){.options{grid-template-columns:1fr}.panel{padding:16px}.question{padding:15px}.han{font-size:30px}}
</style>
</head><body>
<header><div class="brand">합격킹 HSK</div><div style="margin-top:7px;font-weight:700">화선쌤 속사포 0-3급</div><h1>HSK 3급 필수단어 [4]</h1><p>한자를 눌러 발음을 듣고 알맞은 뜻을 골라보세요!</p></header>
<main class="wrap">
<section class="panel"><div class="bar"><span id="mode" class="tag">전체 어휘 테스트</span><span class="muted" id="count"></span></div><div class="progress"><div id="fill" style="width:0"></div></div><p class="muted">기본단어는 기본단어 뜻끼리, 개사는 개사 뜻끼리 출제됩니다. 병음은 채점 후 오답에만 표시됩니다.</p><div class="btns"><button class="btn secondary" id="previous">이전 결과 다시 보기</button><button class="btn secondary" id="retry">틀린 문제 다시 풀기</button><button class="btn secondary" id="restart">처음부터 다시 풀기</button></div></section>
<section class="panel hidden" id="summary" aria-live="polite"></section><section id="questions"></section>
<div class="panel" id="submitbox"><button class="btn" id="grade" style="width:100%">채점하기</button><p class="muted" style="text-align:center;margin-bottom:0">선택하지 않은 문제는 오답 처리됩니다.</p></div>
<footer>합격킹 HSK · 화선쌤 속사포 0-3급</footer>
</main>
<script>
const DATA=[{"id":"basic0","han":"害怕","pinyin":"hàipà","meaning":"[동] 두려워하다, 무서워하다","group":"basic"},{"id":"basic1","han":"号","pinyin":"hào","meaning":"[명] 일 / 번호 / 호 / 사이즈","group":"basic"},{"id":"basic2","han":"河","pinyin":"hé","meaning":"[명] 강","group":"basic"},{"id":"basic3","han":"江","pinyin":"jiāng","meaning":"[명] 강","group":"basic"},{"id":"basic4","han":"黑板","pinyin":"hēibǎn","meaning":"[명] 칠판","group":"basic"},{"id":"basic5","han":"后面","pinyin":"hòumiàn","meaning":"[명] 뒤쪽","group":"basic"},{"id":"basic6","han":"前面","pinyin":"qiánmiàn","meaning":"[명] 앞쪽","group":"basic"},{"id":"basic7","han":"后来","pinyin":"hòulái","meaning":"[명] 그 후, 그 다음, 나중","group":"basic"},{"id":"basic8","han":"护照","pinyin":"hùzhào","meaning":"[명] 여권","group":"basic"},{"id":"basic9","han":"花","pinyin":"huā","meaning":"[동] 소비하다, 쓰다","group":"basic"},{"id":"basic10","han":"坏","pinyin":"huài","meaning":"[형] 나쁘다 / 고장나다 / 상하다","group":"basic"},{"id":"basic11","han":"欢迎","pinyin":"huānyíng","meaning":"[동] 환영하다","group":"basic"},{"id":"basic12","han":"换","pinyin":"huàn","meaning":"[동] 바꾸다","group":"basic"},{"id":"basic13","han":"黄河","pinyin":"huánghé","meaning":"[명] 황하","group":"basic"},{"id":"basic14","han":"回答","pinyin":"huídá","meaning":"[명/동] 대답(하다)","group":"basic"},{"id":"basic15","han":"会议","pinyin":"huìyì","meaning":"[명] 회의","group":"basic"},{"id":"basic16","han":"鸡蛋","pinyin":"jīdàn","meaning":"[명] 달걀","group":"basic"},{"id":"basic17","han":"教室","pinyin":"jiàoshì","meaning":"[명] 교실","group":"basic"},{"id":"basic18","han":"介绍","pinyin":"jièshào","meaning":"[동] 소개하다","group":"basic"},{"id":"basic19","han":"进","pinyin":"jìn","meaning":"[동] 들어가다, 들어오다","group":"basic"},{"id":"basic20","han":"觉得","pinyin":"juéde","meaning":"[동] ~라고 생각하다","group":"basic"},{"id":"basic21","han":"机会","pinyin":"jīhuì","meaning":"[명] 기회","group":"basic"},{"id":"basic22","han":"记得","pinyin":"jìde","meaning":"[동] 기억하다","group":"basic"},{"id":"basic23","han":"季节","pinyin":"jìjié","meaning":"[명] 계절","group":"basic"},{"id":"basic24","han":"检查","pinyin":"jiǎnchá","meaning":"[동] 검사하다, 점검하다","group":"basic"},{"id":"basic25","han":"简单","pinyin":"jiǎndān","meaning":"[형] 간단하다, 단순하다","group":"basic"},{"id":"basic26","han":"健康","pinyin":"jiànkāng","meaning":"[명/형] 건강(하다)","group":"basic"},{"id":"basic27","han":"讲","pinyin":"jiǎng","meaning":"[동] 이야기하다, 설명하다, 강의하다","group":"basic"},{"id":"basic28","han":"教","pinyin":"jiāo","meaning":"[동] 가르치다","group":"basic"},{"id":"basic29","han":"脚","pinyin":"jiǎo","meaning":"[명] 발","group":"basic"},{"id":"prep0","han":"把","pinyin":"bǎ","meaning":"[개] ~을, 를 (목적어를 앞으로 전치하는 역할)","group":"prep"},{"id":"prep1","han":"被","pinyin":"bèi","meaning":"[개] ~에게 ~을 당하다","group":"prep"},{"id":"prep2","han":"比","pinyin":"bǐ","meaning":"[개] ~보다","group":"prep"},{"id":"prep3","han":"有","pinyin":"yǒu","meaning":"~만큼","group":"prep"}];
const STORE='hsk_3_part4_last_v1';
const byId=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let questions=[],answers={},graded=false,wrong=[],mode='전체 어휘 테스트';
function speak(word){if(!('speechSynthesis' in window)){alert('이 브라우저에서는 음성 읽기를 지원하지 않습니다.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='zh-CN';u.rate=.78;let voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase().startsWith('zh-cn'))||voices.find(v=>v.lang.toLowerCase().startsWith('zh'));if(v)u.voice=v;speechSynthesis.speak(u)}
function choiceList(q){let pool=DATA.filter(x=>x.group===q.group&&x.meaning!==q.meaning);let distinct=[...new Set(pool.map(x=>x.meaning))];return shuffle([q.meaning,...shuffle(distinct).slice(0,3)])}
function start(items=DATA,label='전체 어휘 테스트'){questions=shuffle(items).map(q=>({...q,choices:choiceList(q)}));answers={};graded=false;wrong=[];mode=label;render();window.scrollTo(0,0)}
function render(){byId('mode').textContent=mode;byId('summary').classList.add('hidden');byId('submitbox').classList.remove('hidden');byId('grade').disabled=false;let root=byId('questions');root.innerHTML='';questions.forEach((q,i)=>{let el=document.createElement('article');el.className='panel question';let opts=q.choices.map((c,j)=>`<button class="opt" data-choice="${j}" type="button">${escapeHTML(c)}</button>`).join('');el.innerHTML=`<div class="qhead"><span class="tag">${q.group==='basic'?'기본단어':'개사'} · ${i+1}번</span><span class="muted">🔊 한자 클릭</span></div><button class="han" type="button" title="중국어 발음 듣기">${escapeHTML(q.han)}</button><div class="options">${opts}</div><div class="feedback hidden"></div>`;el.querySelector('.han').addEventListener('click',()=>speak(q.han));el.querySelectorAll('.opt').forEach((b,j)=>b.addEventListener('click',()=>{if(graded)return;answers[q.id]=q.choices[j];el.querySelectorAll('.opt').forEach(n=>n.classList.remove('selected'));b.classList.add('selected');updateProgress()}));root.appendChild(el)});updateProgress();try{byId('previous').disabled=!localStorage.getItem(STORE)}catch(e){byId('previous').disabled=true}byId('retry').disabled=true}
function updateProgress(){let n=questions.filter(q=>answers[q.id]!==undefined).length;byId('count').textContent=`${n} / ${questions.length}문제 선택`;byId('fill').style.width=`${questions.length?100*n/questions.length:0}%`}
function applyResult(){wrong=[];questions.forEach((q,i)=>{let correct=answers[q.id]===q.meaning;if(!correct)wrong.push(q.id);let el=byId('questions').children[i];el.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.choices[j]===q.meaning)b.classList.add('correct');if(q.choices[j]===answers[q.id]&&!correct)b.classList.add('wrong');if(q.choices[j]===answers[q.id])b.classList.add('selected')});if(!correct){let f=el.querySelector('.feedback');f.classList.remove('hidden');f.innerHTML=`<strong>오답 · 정답 확인</strong><div>병음: ${escapeHTML(q.pinyin)}</div><div>뜻: ${escapeHTML(q.meaning)}</div>`}});byId('retry').disabled=wrong.length===0;let correct=questions.length-wrong.length;let s=byId('summary');s.classList.remove('hidden');s.innerHTML=`<div class="tag">채점 결과</div><div class="score">${correct} / ${questions.length}문제 정답 · ${questions.length?Math.round(correct/questions.length*100):0}점</div><p class="muted">틀린 문제 ${wrong.length}개 · 틀린 문제 아래에서 병음과 뜻을 확인하세요.</p>`}
function grade(){if(graded)return;graded=true;applyResult();let record={questions:questions.map(q=>({id:q.id,choices:q.choices})),answers:{...answers},mode,at:new Date().toLocaleString('ko-KR')};try{localStorage.setItem(STORE,JSON.stringify(record));byId('previous').disabled=false}catch(e){}byId('grade').disabled=true;window.scrollTo({top:0,behavior:'smooth'})}
function previous(){let record;try{record=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}if(!record||!Array.isArray(record.questions)){alert('저장된 이전 결과가 없습니다.');return}let items=record.questions.map(item=>{let q=DATA.find(x=>x.id===item.id);return q?{...q,choices:Array.isArray(item.choices)?item.choices:choiceList(q)}:null}).filter(Boolean);if(!items.length)return;questions=items;answers=record.answers||{};mode=(record.mode||'전체 어휘 테스트')+' · 이전 결과';graded=false;render();graded=true;applyResult();byId('submitbox').classList.add('hidden');window.scrollTo(0,0)}
byId('grade').addEventListener('click',grade);
byId('restart').addEventListener('click',()=>start());
byId('retry').addEventListener('click',()=>{if(!graded||!wrong.length)return;start(DATA.filter(q=>wrong.includes(q.id)),'틀린 문제 다시 풀기')});
byId('previous').addEventListener('click',previous);
start();
</script></body></html>
